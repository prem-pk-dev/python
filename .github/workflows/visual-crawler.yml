name: Visual Website Crawler (Playwright)
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Public website URL to crawl
        required: true
        type: string
      max_pages:
        description: Maximum pages in this run (1-100)
        required: true
        default: "50"
        type: string
      devices:
        description: Screenshot device profiles
        required: true
        default: all
        type: choice
        options: [desktop, mobile, all]
      capture:
        description: Screenshot type
        required: true
        default: both
        type: choice
        options: [full, viewport, both]
permissions:
  contents: read
  actions: read
concurrency:
  group: visual-crawl-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate crawler Python syntax
        run: python -m py_compile scripts/visual_crawler.py
      - name: Run visual crawler
        env:
          TARGET_URL: ${{ inputs.target_url }}
          MAX_PAGES: ${{ inputs.max_pages }}
          DEVICES: ${{ inputs.devices }}
          CAPTURE: ${{ inputs.capture }}
        run: |
          python scripts/visual_crawler.py --url "$TARGET_URL" --max-pages "$MAX_PAGES" --devices "$DEVICES" --capture "$CAPTURE"
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-crawl-${{ github.run_id }}
          path: visual-crawl-output/
          if-no-files-found: warn
          retention-days: 7
