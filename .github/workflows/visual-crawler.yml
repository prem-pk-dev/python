name: Visual Website Crawler (Playwright)
on:
  workflow_dispatch:
    inputs:
      crawl_id:
        description: Live dashboard session ID
        required: true
        type: string
      target_url:
        description: Public website URL to crawl
        required: true
        type: string
      max_pages:
        description: Maximum pages in this run (1-100)
        required: true
        default: "50"
        type: string
      devices:
        description: Device profiles
        required: true
        default: "Desktop,Tablet,Mobile"
        type: choice
        options:
          - "Desktop"
          - "Tablet"
          - "Mobile"
          - "Desktop,Tablet,Mobile"
      screenshot_mode:
        description: Screenshot capture mode
        required: true
        default: both
        type: choice
        options: [viewport, full_page, both]
permissions:
  contents: read
concurrency:
  group: visual-crawl-${{ github.event.inputs.crawl_id }}
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and image encoder
        run: |
          python -m pip install --upgrade pip
          pip install playwright httpx pillow
          python -m playwright install --with-deps chromium
      - name: Validate crawler Python syntax
        run: python -m py_compile scripts/visual_crawler.py
      - name: Run RAM-only live visual crawler
        env:
          CRAWL_ID: ${{ inputs.crawl_id }}
          TARGET_URL: ${{ inputs.target_url }}
          MAX_PAGES: ${{ inputs.max_pages }}
          DEVICES: ${{ inputs.devices }}
          SCREENSHOT_MODE: ${{ inputs.screenshot_mode }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
        run: |
          test -n "$INGEST_SECRET" || (echo "INGEST_SECRET secret is missing" && exit 1)
          test -n "$WORKER_BASE_URL" || (echo "WORKER_BASE_URL repository variable is missing" && exit 1)
          python scripts/visual_crawler.py --crawl-id "$CRAWL_ID" --url "$TARGET_URL" --max-pages "$MAX_PAGES" --devices "$DEVICES" --screenshot-mode "$SCREENSHOT_MODE"
