name: Validate Live Crawler
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker module syntax
        run: node --input-type=module --check < cloudflare/worker.js
      - name: Test SEO and site discovery modules
        run: node --test tests/seo-tools.test.mjs
      - name: Validate Wrangler bundle and Durable Object migration
        run: npx wrangler deploy --dry-run --config cloudflare/wrangler.toml
      - name: Validate embedded dashboard JavaScript
        run: |
          tmp="$(mktemp --suffix=.js)"
          trap 'rm -f "$tmp"' EXIT
          node --input-type=module -e '
            import fs from "node:fs";
            const source = fs.readFileSync("cloudflare/worker.js", "utf8");
            const marker = "const HTML = String.raw`";
            const start = source.indexOf(marker);
            if (start < 0) throw new Error("Dashboard HTML template not found");
            const contentStart = start + marker.length;
            const boundary = source.indexOf("const cors", contentStart);
            const end = source.lastIndexOf("`", boundary);
            if (boundary < 0 || end < contentStart) throw new Error("Dashboard HTML template boundary not found");
            const html = source.slice(contentStart, end);
            const scriptStart = html.lastIndexOf("<script>");
            const scriptEnd = html.lastIndexOf("</script>");
            if (scriptStart < 0 || scriptEnd < scriptStart) throw new Error("Main inline dashboard script not found");
            process.stdout.write(html.slice(scriptStart + 8, scriptEnd));
          ' > "$tmp"
          node --check "$tmp"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Playwright crawler syntax
        run: python -m py_compile scripts/visual_crawler.py
      - name: Test sitemap discovery helpers
        run: python -m unittest scripts.test_visual_crawler -v
      - name: Enforce no screenshot artifacts or DO storage API usage
        run: |
          ! grep -q "actions/upload-artifact" .github/workflows/visual-crawler.yml
          ! grep -Eq "state\\.storage|storage\\.put|storage\\.get|storage\\.delete" cloudflare/worker.js
